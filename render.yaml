# render.yaml — deploys the TaskFlow.API monolith on Render's free tier.
# Microservices (auth/projects/notifications) are in the codebase for
# architecture demonstration — the monolith is the production entry point.
#
# One-time setup:
#   1. Create a PostgreSQL database on neon.tech (free) — copy the connection string.
#   2. Create a RabbitMQ instance on cloudamqp.com (free) — copy the AMQP URL.
#   3. Connect this repo in the Render dashboard → select "Use render.yaml".
#   4. Set the secret env vars in Render dashboard (marked sync: false below).

services:
  - type: web
    name: taskflow-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "5000"
      - key: DOTNET_hostBuilder__reloadConfigOnChange
        value: "false"
      - key: Jwt__Issuer
        value: TaskFlowAPI
      - key: Jwt__Audience
        value: TaskFlowClient
      - key: Jwt__ExpiresInHours
        value: "24"
      # Set these in Render dashboard → Environment (never commit real values):
      - key: ConnectionStrings__DefaultConnection
        sync: false   # Host=ep-wispy-tree-azbl11db.c-3.ap-southeast-1.aws.neon.tech;Database=neondb;Username=neondb_owner;Password=<NEON_PASSWORD>;SSL Mode=VerifyFull;Channel Binding=Require
      - key: Jwt__Secret
        sync: false   # Random 32+ char string
