apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: taskflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      containers:
        - name: auth-api
          image: taskflow-auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: Jwt__Issuer
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: Jwt__Issuer
            - name: Jwt__Audience
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: Jwt__Audience
            - name: Jwt__ExpiresInHours
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: Jwt__ExpiresInHours
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: taskflow-secret
                  key: DB_CONNECTION_STRING
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: taskflow-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /api/auth/health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: taskflow
spec:
  selector:
    app: auth-api
  ports:
    - port: 5001
      targetPort: 5001
