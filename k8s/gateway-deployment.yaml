apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: taskflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: taskflow-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: Jwt__Issuer
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: Jwt__Issuer
            - name: Jwt__Audience
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: Jwt__Audience
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: taskflow-secret
                  key: JWT_SECRET
            # Override YARP cluster destinations to use k8s service names
            - name: ReverseProxy__Clusters__auth-cluster__Destinations__primary__Address
              value: "http://auth-service:5001/"
            - name: ReverseProxy__Clusters__projects-cluster__Destinations__primary__Address
              value: "http://projects-service:5002/"
            - name: ReverseProxy__Clusters__notifications-cluster__Destinations__primary__Address
              value: "http://notifications-service:5003/"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: taskflow
spec:
  selector:
    app: gateway
  ports:
    - port: 5000
      targetPort: 5000
