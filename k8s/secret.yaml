kind: Secret
metadata:
  name: taskflow-secret
  namespace: taskflow
  # Secret = like ConfigMap but values are base64-encoded at rest.
  # In production: use a secrets manager (Vault, AWS SSM) — never commit real secrets.
type: Opaque
stringData:
  MSSQL_SA_PASSWORD: "TaskFlow@123"
  JWT_SECRET: "taskflow-dev-secret-replace-this-in-production-min32chars!"
  RABBITMQ_PASSWORD: "guest"
  DB_CONNECTION_STRING: "Server=database-service,1433;Database=TaskFlowDb;User Id=sa;Password=TaskFlow@123;TrustServerCertificate=true"
