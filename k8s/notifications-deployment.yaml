apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-api
  namespace: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-api
  template:
    metadata:
      labels:
        app: notifications-api
    spec:
      containers:
        - name: notifications-api
          image: taskflow-notifications:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: Jwt__Issuer
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: Jwt__Issuer
            - name: Jwt__Audience
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: Jwt__Audience
            - name: RabbitMQ__Host
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: RabbitMQ__Host
            - name: RabbitMQ__Username
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: RabbitMQ__Username
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: taskflow-secret
                  key: DB_CONNECTION_STRING
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: taskflow-secret
                  key: JWT_SECRET
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: taskflow-secret
                  key: RABBITMQ_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/notifications/health
              port: 5003
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-service
  namespace: taskflow
spec:
  selector:
    app: notifications-api
  ports:
    - port: 5003
      targetPort: 5003
