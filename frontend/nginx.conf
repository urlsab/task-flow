server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular uses client-side routing.
    # Without this, refreshing /projects/5 returns a 404 from nginx.
    # try_files: check for the file, then the directory, then fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api/* calls to the backend container.
    # "backend" resolves via Docker's internal DNS — containers talk by service name.
    location /api/ {
        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
